name: Mobile CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'OnlineCasinoFront/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'OnlineCasinoFront/**'
      - '.github/workflows/ci-mobile.yml'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck React Native
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OnlineCasinoFront

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OnlineCasinoFront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present -- --watchAll=false